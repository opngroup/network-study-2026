# 과제 C nginx 설정
# 브라우저(curl) → nginx :8080 → app:3000
# 504를 빨리 보려고 proxy_read_timeout을 2초로 짧게 둔다. (기본값은 60초)

worker_processes 1;
events { worker_connections 256; }

http {
  # 접근 로그에 nginx가 본 상태(status)와 앱이 준 상태(upstream_status)를 나란히 남긴다.
  # 502·504는 upstream_status가 비거나 504로 찍히고, 500은 둘 다 500이다.
  log_format study '$remote_addr "$request" status=$status upstream_status=$upstream_status '
                   'request_time=$request_time upstream_time=$upstream_response_time req_id=$request_id';
  access_log /dev/stdout study;
  error_log  /dev/stderr warn;

  upstream app {
    server app:3000;
    keepalive 8;              # nginx → 앱 연결을 다시 써서 TIME_WAIT가 쌓이지 않게 (과제 B에서 본 것)
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;          # upstream keepalive는 HTTP/1.1 + Connection 헤더 비우기가 필요
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;   # 앱 로그와 nginx 로그를 같은 값으로 묶는다

      proxy_connect_timeout 2s;
      proxy_read_timeout    2s;        # 앱이 2초 안에 답을 시작하지 않으면 504
    }
  }
}
