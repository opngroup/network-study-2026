<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d08a00"/></marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4bc4"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1000" height="460" fill="#fff"/>

  <!-- 답 한 줄 -->
  <rect x="16" y="10" width="968" height="58" rx="14" fill="#1c1b19"/>
  <text x="500" y="46" text-anchor="middle" font-size="20" font-weight="800" fill="#ffe7a0">끊을 때도 통로마다 "다 보냈다"를 알리고 확인받아야, 오가던 데이터를 잃지 않는다</text>

  <!-- 상황 -->
  <text x="500" y="94" text-anchor="middle" font-size="14" fill="#4b5563">상황: 클라이언트는 "hello" 를 다 보냈다. 서버는 아직 <tspan font-weight="700" fill="#d08a00">메아리 "hello"</tspan> 를 보내는 중이다.</text>

  <!-- ❌ 왼쪽 -->
  <rect x="16" y="110" width="470" height="338" rx="16" fill="#fdf1ef" stroke="#c0392b" stroke-width="2"/>
  <text x="251" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">❌ 클라이언트가 그냥 탁 끊으면 (RST)</text>
  <rect x="40" y="156" width="96" height="36" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="88" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3440">클라이언트</text>
  <rect x="366" y="156" width="96" height="36" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="414" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a00">서버</text>
  <line x1="88" y1="192" x2="88" y2="380" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="414" y1="192" x2="414" y2="380" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>

  <line x1="92" y1="226" x2="408" y2="226" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <rect x="190" y="212" width="120" height="26" rx="13" fill="#c0392b"/>
  <text x="250" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RST  탁!</text>
  <text x="96" y="262" font-size="12" fill="#c0392b" font-weight="700">클라이언트 소켓 즉시 사라짐</text>

  <line x1="410" y1="296" x2="190" y2="296" stroke="#d08a00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#d)"/>
  <rect x="250" y="283" width="110" height="26" rx="13" fill="#d08a00"/>
  <text x="305" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">메아리 "hello"</text>
  <text x="152" y="304" font-size="24">💨</text>
  <text x="96" y="336" font-size="13" fill="#2b3440">받을 사람이 없다 → <tspan font-weight="700" fill="#c0392b">데이터가 사라진다</tspan></text>
  <text x="96" y="358" font-size="13" fill="#2b3440">서버 recv() → <tspan font-family="Menlo, monospace" fill="#c0392b">ConnectionResetError</tspan></text>

  <text x="251" y="420" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="700">빠르지만, 오가던 데이터를 잃는다</text>

  <text x="500" y="280" text-anchor="middle" font-size="30" fill="#9aa3ad">→</text>

  <!-- ✅ 오른쪽 -->
  <rect x="514" y="110" width="470" height="338" rx="16" fill="#f4effb" stroke="#7b4bc4" stroke-width="2"/>
  <text x="749" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#7b4bc4">✅ 4번 인사하고 끊으면 (FIN)</text>
  <rect x="538" y="156" width="96" height="36" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="586" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3440">클라이언트</text>
  <rect x="864" y="156" width="96" height="36" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="912" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a00">서버</text>
  <line x1="586" y1="192" x2="586" y2="400" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="912" y1="192" x2="912" y2="400" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>

  <g font-size="12" font-weight="700">
    <line x1="590" y1="216" x2="906" y2="216" stroke="#7b4bc4" stroke-width="2.5" marker-end="url(#f)"/>
    <text x="748" y="210" text-anchor="middle" fill="#7b4bc4">① FIN  "나는 다 보냈어"</text>
    <line x1="906" y1="248" x2="590" y2="248" stroke="#4b5563" stroke-width="2.5" marker-end="url(#k)"/>
    <text x="748" y="242" text-anchor="middle" fill="#4b5563">② ACK  "알았어"</text>

    <rect x="600" y="262" width="296" height="54" rx="8" fill="#fff8e6" stroke="#d08a00" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="906" y1="292" x2="590" y2="292" stroke="#d08a00" stroke-width="2.5" marker-end="url(#d)"/>
    <text x="748" y="282" text-anchor="middle" fill="#b26a00">메아리 "hello" 마저 보냄 ✅</text>
    <text x="748" y="310" text-anchor="middle" font-size="11" font-weight="400" fill="#b26a00">서버 → 클라이언트 통로는 아직 열려 있다</text>

    <line x1="906" y1="344" x2="590" y2="344" stroke="#7b4bc4" stroke-width="2.5" marker-end="url(#f)"/>
    <text x="748" y="339" text-anchor="middle" fill="#7b4bc4">③ FIN  "나도 다 보냈어"</text>
    <line x1="590" y1="376" x2="906" y2="376" stroke="#4b5563" stroke-width="2.5" marker-end="url(#k)"/>
    <text x="748" y="370" text-anchor="middle" fill="#4b5563">④ ACK  "알았어"</text>
  </g>
  <text x="749" y="420" text-anchor="middle" font-size="14" fill="#7b4bc4" font-weight="700">조금 느리지만, 데이터를 하나도 잃지 않는다</text>
</svg>
