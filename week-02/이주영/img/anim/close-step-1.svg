<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4bc4"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d08a00"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#fff"/>
  <!-- 머리 -->
  <text x="70" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7a">클라이언트 코드</text>
  <rect x="150" y="12" width="140" height="44" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="220" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#2b3440">클라이언트 OS</text>
  <text x="220" y="49" text-anchor="middle" font-size="13" fill="#2b3440">먼저 끊는 쪽</text>
  <rect x="710" y="12" width="140" height="44" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="780" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#7a4a00">서버 OS</text>
  <text x="780" y="49" text-anchor="middle" font-size="13" fill="#7a4a00">나중에 끊는 쪽</text>
  <text x="930" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4a00">서버 코드</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="66" width="140" height="44" fill="#e6f2e4" stroke="#2f7d32" stroke-width="1.5"/><text x="220" y="93" fill="#2f7d32">ESTABLISHED</text></g>
<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="710" y="66" width="140" height="44" fill="#e6f2e4" stroke="#2f7d32" stroke-width="1.5"/><text x="780" y="93" fill="#2f7d32">ESTABLISHED</text></g>
  <!-- 클라이언트 코드: close() -->
  <rect x="14" y="90" width="112" height="40" rx="8" fill="#f6f7f9" stroke="#9aa3ad" stroke-width="1.2"/>
  <text x="70" y="115" text-anchor="middle" font-size="16" fill="#2b3440" font-family="Menlo, monospace" font-weight="700">close()</text>
  <line x1="126" y1="110" x2="146" y2="110" stroke="#2f5d8a" stroke-width="2" marker-end="url(#c)"/>
  <text x="70" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#7b4bc4">⏱ 해제 시작</text>

  <!-- ① FIN -->
  <line x1="294" y1="110" x2="704" y2="110" stroke="#7b4bc4" stroke-width="3" marker-end="url(#f)"/>
  <rect x="330" y="88" width="340" height="44" rx="12" fill="#7b4bc4"/>
  <text x="500" y="107" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">① FIN   seq = 2000</text>
  <text x="500" y="124" text-anchor="middle" font-size="14" fill="#efe6fb">"클라이언트 → 서버 통로, 나는 다 보냈어"</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="110" width="140" height="60" fill="#e9dcf7" stroke="#7b4bc4" stroke-width="1.5"/><text x="220" y="145" fill="#5b2fa3">FIN_WAIT_1</text></g>
</svg>
