<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4bc4"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d08a00"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker>
  </defs>
  <style>
.s{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.s0{animation-delay:0s}
.s1{animation-delay:1.7s}
.s2{animation-delay:3.5s}
.s3{animation-delay:5.3s}
.s4{animation-delay:7.3s}
.s5{animation-delay:9.3s}
.s6{animation-delay:11.4s}
@keyframes m0{0%{transform:translate(294px,110px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(704px,110px);opacity:0}}
.d0{opacity:0;animation:m0 1.1s ease-in-out 0.6s forwards}
@keyframes m1{0%{transform:translate(706px,170px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(296px,170px);opacity:0}}
.d1{opacity:0;animation:m1 1.1s ease-in-out 2.4s forwards}
@keyframes m2{0%{transform:translate(706px,276px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(296px,276px);opacity:0}}
.d2{opacity:0;animation:m2 1.1s ease-in-out 4.2s forwards}
@keyframes m3{0%{transform:translate(706px,350px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(296px,350px);opacity:0}}
.d3{opacity:0;animation:m3 1.1s ease-in-out 6.2s forwards}
@keyframes m4{0%{transform:translate(294px,410px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(704px,410px);opacity:0}}
.d4{opacity:0;animation:m4 1.1s ease-in-out 8.2s forwards}
</style>
<rect width="1000" height="660" fill="#fff"/>
<g class="s s0">  <!-- 머리 -->
  <text x="70" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7a">클라이언트 코드</text>
  <rect x="150" y="12" width="140" height="44" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="220" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#2b3440">클라이언트 OS</text>
  <text x="220" y="49" text-anchor="middle" font-size="13" fill="#2b3440">먼저 끊는 쪽</text>
  <rect x="710" y="12" width="140" height="44" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="780" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#7a4a00">서버 OS</text>
  <text x="780" y="49" text-anchor="middle" font-size="13" fill="#7a4a00">나중에 끊는 쪽</text>
  <text x="930" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4a00">서버 코드</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="66" width="140" height="44" fill="#e6f2e4" stroke="#2f7d32" stroke-width="1.5"/><text x="220" y="93" fill="#2f7d32">ESTABLISHED</text></g>
<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="710" y="66" width="140" height="44" fill="#e6f2e4" stroke="#2f7d32" stroke-width="1.5"/><text x="780" y="93" fill="#2f7d32">ESTABLISHED</text></g>
  <!-- 클라이언트 코드: close() -->
  <rect x="14" y="90" width="112" height="40" rx="8" fill="#f6f7f9" stroke="#9aa3ad" stroke-width="1.2"/>
  <text x="70" y="115" text-anchor="middle" font-size="16" fill="#2b3440" font-family="Menlo, monospace" font-weight="700">close()</text>
  <line x1="126" y1="110" x2="146" y2="110" stroke="#2f5d8a" stroke-width="2" marker-end="url(#c)"/>
  <text x="70" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#7b4bc4">⏱ 해제 시작</text>

</g>
<g class="s s1">  <!-- ① FIN -->
  <line x1="294" y1="110" x2="704" y2="110" stroke="#7b4bc4" stroke-width="3" marker-end="url(#f)"/>
  <rect x="330" y="88" width="340" height="44" rx="12" fill="#7b4bc4"/>
  <text x="500" y="107" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">① FIN   seq = 2000</text>
  <text x="500" y="124" text-anchor="middle" font-size="14" fill="#efe6fb">"클라이언트 → 서버 통로, 나는 다 보냈어"</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="110" width="140" height="60" fill="#e9dcf7" stroke="#7b4bc4" stroke-width="1.5"/><text x="220" y="145" fill="#5b2fa3">FIN_WAIT_1</text></g>
</g>
<g class="s s2">  <!-- ② ACK -->
  <line x1="706" y1="170" x2="296" y2="170" stroke="#4b5563" stroke-width="3" marker-end="url(#k)"/>
  <rect x="340" y="148" width="320" height="44" rx="12" fill="#4b5563"/>
  <text x="500" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">② ACK   ack = 2001</text>
  <text x="500" y="184" text-anchor="middle" font-size="14" fill="#e5e7eb">"알았어" — 서버 OS 가 바로 대답</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="170" width="140" height="240" fill="#e9dcf7" stroke="#7b4bc4" stroke-width="1.5"/><text x="220" y="285" fill="#5b2fa3">FIN_WAIT_2</text>
    <text x="220" y="305" fill="#5b2fa3" font-size="13" font-weight="400" font-family="-apple-system, sans-serif">상대 FIN 을 기다림</text></g>
<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="710" y="110" width="140" height="240" fill="#7b4bc4" stroke="#5b2fa3" stroke-width="1.5"/><text x="780" y="225" fill="#fff">CLOSE_WAIT</text>
    <text x="780" y="245" fill="#efe6fb" font-size="13" font-weight="400" font-family="-apple-system, sans-serif">내 close() 를 기다림</text></g>
</g>
<g class="s s3">  <!-- half-close 구간 -->
  <rect x="300" y="200" width="400" height="122" rx="12" fill="#fff8e6" stroke="#d08a00" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="222" text-anchor="middle" font-size="16" font-weight="800" fill="#b26a00">⏳ half-close — 한쪽 통로만 닫힌 상태</text>
  <text x="500" y="240" text-anchor="middle" font-size="13" fill="#b26a00">클라이언트 쪽 통로만 닫혔다 · 서버 쪽 통로는 아직 열려 있다</text>
  <line x1="706" y1="276" x2="296" y2="276" stroke="#d08a00" stroke-width="3" marker-end="url(#d)"/>
  <rect x="400" y="262" width="200" height="28" rx="14" fill="#d08a00"/>
  <text x="500" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">메아리 "hello" 마저 보냄</text>
  <text x="500" y="308" text-anchor="middle" font-size="14" fill="#2b3440">FIN_WAIT_2 에서도 <tspan font-weight="700">받을 수는 있다</tspan> → 데이터를 잃지 않는다</text>

  <!-- 서버 코드: recv → b'' , close() -->
  <rect x="874" y="196" width="118" height="52" rx="8" fill="#fffaf2" stroke="#d98a1a" stroke-width="1.2"/>
  <text x="933" y="216" text-anchor="middle" font-size="15" fill="#2f5d8a" font-family="Menlo, monospace" font-weight="700">recv() → b''</text>
  <text x="933" y="236" text-anchor="middle" font-size="13" fill="#7a4a00">"클라이언트가 끊었네"</text>
  <line x1="854" y1="222" x2="872" y2="222" stroke="#2f5d8a" stroke-width="2" marker-end="url(#c)"/>

  </g>
<g class="s s4"><rect x="874" y="330" width="118" height="40" rx="8" fill="#fffaf2" stroke="#d98a1a" stroke-width="1.2"/>
  <text x="933" y="355" text-anchor="middle" font-size="16" fill="#2f5d8a" font-family="Menlo, monospace" font-weight="700">close()</text>
  <line x1="874" y1="350" x2="856" y2="350" stroke="#2f5d8a" stroke-width="2" marker-end="url(#c)"/>
  <text x="933" y="388" text-anchor="middle" font-size="13" fill="#7a4a00">이걸 불러야 ③</text>

  <!-- ③ FIN -->
  <line x1="706" y1="350" x2="296" y2="350" stroke="#7b4bc4" stroke-width="3" marker-end="url(#f)"/>
  <rect x="320" y="328" width="360" height="44" rx="12" fill="#7b4bc4"/>
  <text x="500" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">③ FIN   seq = 7000 · ack = 2001</text>
  <text x="500" y="364" text-anchor="middle" font-size="14" fill="#efe6fb">"서버 → 클라이언트 통로, 나도 다 보냈어"</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="710" y="350" width="140" height="60" fill="#e9dcf7" stroke="#7b4bc4" stroke-width="1.5"/><text x="780" y="385" fill="#5b2fa3">LAST_ACK</text></g>
</g>
<g class="s s5">  <!-- ④ ACK -->
  <line x1="294" y1="410" x2="704" y2="410" stroke="#4b5563" stroke-width="3" marker-end="url(#k)"/>
  <rect x="360" y="388" width="280" height="44" rx="12" fill="#4b5563"/>
  <text x="500" y="407" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">④ ACK   ack = 7001</text>
  <text x="500" y="424" text-anchor="middle" font-size="14" fill="#e5e7eb">"알았어" — 마지막 말</text>

<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="410" width="140" height="170" fill="#ffd79a" stroke="#b26a00" stroke-width="2.5"/><text x="220" y="490" fill="#7a4a00" font-size="18">TIME_WAIT</text>
    <text x="220" y="512" fill="#7a4a00" font-size="14" font-weight="400" font-family="-apple-system, sans-serif">≈ 30초 (2MSL)</text></g>
<g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="710" y="410" width="140" height="200" fill="#eceff1" stroke="#9aa3ad" stroke-width="1.5"/><text x="780" y="500" fill="#4b5563">CLOSED</text>
    <text x="780" y="520" fill="#4b5563" font-size="14" font-weight="400" font-family="-apple-system, sans-serif">바로 끝 ✅</text></g>
  <!-- TIME_WAIT 설명 -->
  <rect x="320" y="450" width="370" height="96" rx="10" fill="#fff8ec" stroke="#b26a00" stroke-width="1.5"/>
  <text x="336" y="472" font-size="16" font-weight="700" fill="#7a4a00">⏳ 마지막 ④ 를 보낸 클라이언트만 남아서 기다린다</text>
  <text x="336" y="494" font-size="14" fill="#2b3440">· ④ 가 사라지면 ③ FIN 이 다시 온다 → 다시 대답해 준다</text>
  <text x="336" y="514" font-size="14" fill="#2b3440">· 늦게 온 옛 패킷이 다음 연결에 섞이지 않게 한다</text>
  <text x="336" y="534" font-size="14" fill="#2b3440">· 서버는 ④ 를 받자마자 CLOSED — 기다릴 이유가 없다</text>
  <line x1="290" y1="490" x2="320" y2="490" stroke="#b26a00" stroke-width="1.5"/>

</g>
<g class="s s6"><g font-family="Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle"><rect x="150" y="580" width="140" height="30" fill="#eceff1" stroke="#9aa3ad" stroke-width="1.5"/><text x="220" y="600" fill="#4b5563">CLOSED</text></g>
  <!-- 바닥 -->
  <rect x="20" y="620" width="960" height="34" rx="8" fill="#f6f1e6" stroke="#dcd4c4"/>
  <text x="34" y="642" font-size="14" fill="#2b3440"><tspan font-weight="700">FIN 도 SYN 처럼 번호 한 칸</tspan>을 쓴다 → seq 2000 이면 ack 2001 <tspan fill="#857e72">(RFC 9293 §3.4)</tspan>  ·  ②는 OS 가 바로, ③은 서버 코드의 close() 를 기다려서 → 따로 나가 4번  <tspan fill="#857e72">· 숫자는 예시</tspan></text>

</g>
<g class="d0"><circle r="15" fill="#7b4bc4" opacity=".25"/><circle r="10" fill="#fff" stroke="#7b4bc4" stroke-width="5"/></g>
<g class="d1"><circle r="15" fill="#4b5563" opacity=".25"/><circle r="10" fill="#fff" stroke="#4b5563" stroke-width="5"/></g>
<g class="d2"><circle r="15" fill="#d08a00" opacity=".25"/><circle r="10" fill="#fff" stroke="#d08a00" stroke-width="5"/></g>
<g class="d3"><circle r="15" fill="#7b4bc4" opacity=".25"/><circle r="10" fill="#fff" stroke="#7b4bc4" stroke-width="5"/></g>
<g class="d4"><circle r="15" fill="#4b5563" opacity=".25"/><circle r="10" fill="#fff" stroke="#4b5563" stroke-width="5"/></g>
</svg>
