<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d08a00"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d32"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>

  <!-- 1. 길이 두 개 -->
  <text x="20" y="34" font-size="17" font-weight="800" fill="#2b3440">1. 연결 하나 = 방향이 다른 통로 두 개</text>
  <rect x="20" y="52" width="110" height="96" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="75" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">클라이언트</text>
  <rect x="370" y="52" width="110" height="96" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="425" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4a00">서버</text>
  <line x1="134" y1="80" x2="364" y2="80" stroke="#d08a00" stroke-width="5" marker-end="url(#d)"/>
  <text x="249" y="72" text-anchor="middle" font-size="12" fill="#b26a00" font-weight="700">→ 서버로 가는 통로 · 번호 1000~</text>
  <line x1="364" y1="122" x2="134" y2="122" stroke="#2f7d32" stroke-width="5" marker-end="url(#g)"/>
  <text x="249" y="144" text-anchor="middle" font-size="12" fill="#2f7d32" font-weight="700">← 클라이언트로 오는 통로 · 번호 5000~</text>
  <g font-size="13" fill="#2b3440">
    <text x="20" y="178">· 전화처럼 양쪽이 <tspan font-weight="700">동시에</tspan> 보낼 수 있다 = <tspan font-weight="700">전이중</tspan> (무전기는 번갈아 = 반이중)</text>
    <text x="20" y="200">· 통로마다 <tspan font-weight="700">번호가 따로</tspan> → 시작할 때 양쪽 다 SYN</text>
    <text x="20" y="222">· 끝낼 때도 통로마다 닫는다 → 양쪽 다 <tspan font-weight="700">FIN</tspan> (4-way 의 이유)</text>
  </g>

  <!-- 2. 깃발은 TCP 헤더에 -->
  <text x="520" y="34" font-size="17" font-weight="800" fill="#2b3440">2. SYN · ACK 는 TCP 헤더의 깃발</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="520" y="56" width="90" height="40" fill="#eceff1" stroke="#9aa3ad"/><text x="565" y="81" fill="#4b5563">이더넷</text>
    <rect x="610" y="56" width="80" height="40" fill="#e7eef6" stroke="#2f5d8a"/><text x="650" y="81" fill="#2f5d8a">IP</text>
    <rect x="690" y="56" width="150" height="40" fill="#ffe7a0" stroke="#d08a00" stroke-width="2.5"/><text x="765" y="81" fill="#7a4a00">TCP 헤더 ★</text>
    <rect x="840" y="56" width="90" height="40" fill="#fff" stroke="#c5ccd3"/><text x="885" y="81" fill="#857e72">데이터</text>
    <rect x="930" y="56" width="50" height="40" fill="#eceff1" stroke="#9aa3ad"/><text x="955" y="81" fill="#4b5563">FCS</text>
  </g>
  <line x1="765" y1="96" x2="765" y2="118" stroke="#d08a00" stroke-width="2"/>
  <rect x="580" y="118" width="400" height="56" rx="8" fill="#fffaf0" stroke="#d08a00" stroke-width="1.5"/>
  <g font-size="12" font-family="Menlo, monospace" text-anchor="middle" font-weight="700">
    <rect x="592" y="128" width="70" height="20" rx="4" fill="#fff" stroke="#c5ccd3"/><text x="627" y="142" fill="#4b5563">포트</text>
    <rect x="668" y="128" width="62" height="20" rx="4" fill="#fff" stroke="#c5ccd3"/><text x="699" y="142" fill="#4b5563">seq</text>
    <rect x="736" y="128" width="62" height="20" rx="4" fill="#fff" stroke="#c5ccd3"/><text x="767" y="142" fill="#4b5563">ack</text>
    <rect x="804" y="128" width="40" height="20" rx="4" fill="#2f6fd6"/><text x="824" y="142" fill="#fff">SYN</text>
    <rect x="848" y="128" width="40" height="20" rx="4" fill="#4b5563"/><text x="868" y="142" fill="#fff">ACK</text>
    <rect x="892" y="128" width="40" height="20" rx="4" fill="#7b4bc4"/><text x="912" y="142" fill="#fff">FIN</text>
    <rect x="936" y="128" width="36" height="20" rx="4" fill="#c0392b"/><text x="954" y="142" fill="#fff">RST</text>
  </g>
  <text x="780" y="166" text-anchor="middle" font-size="11" fill="#857e72">깃발 = 켜고 끄는 비트 하나 · SYN+ACK 는 둘 다 켠 것</text>
  <g font-size="13" fill="#2b3440">
    <text x="520" y="200">· IP 는 주소만 보고 배달 — SYN 인지 ACK 인지 모른다</text>
    <text x="520" y="222">· 1주차 캡슐화의 <tspan font-weight="700">TCP 칸</tspan>이 오늘의 무대</text>
  </g>

  <!-- 3. accept 와 대기열 -->
  <line x1="20" y1="246" x2="980" y2="246" stroke="#e5e7eb" stroke-width="2"/>
  <text x="20" y="276" font-size="17" font-weight="800" fill="#2b3440">3. handshake 가 끝나면 → 대기열 → accept()</text>
  <rect x="20" y="296" width="190" height="56" rx="10" fill="#e6f2e4" stroke="#2f7d32" stroke-width="2"/>
  <text x="115" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d32">③ ACK 도착</text>
  <text x="115" y="340" text-anchor="middle" font-size="12" fill="#2f7d32" font-family="Menlo, monospace">ESTABLISHED</text>
  <line x1="214" y1="324" x2="270" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#k)"/>
  <rect x="274" y="296" width="250" height="56" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="399" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a00">서버 OS 대기열</text>
  <g>
    <rect x="300" y="324" width="36" height="20" rx="4" fill="#d98a1a"/>
    <rect x="342" y="324" width="36" height="20" rx="4" fill="#fff" stroke="#d98a1a"/>
    <rect x="384" y="324" width="36" height="20" rx="4" fill="#fff" stroke="#d98a1a"/>
    <rect x="426" y="324" width="36" height="20" rx="4" fill="#fff" stroke="#d98a1a"/>
    <rect x="468" y="324" width="36" height="20" rx="4" fill="#fff" stroke="#d98a1a"/>
  </g>
  <line x1="528" y1="324" x2="584" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#k)"/>
  <rect x="588" y="296" width="190" height="56" rx="10" fill="#e7eef6" stroke="#2f5d8a" stroke-width="2"/>
  <text x="683" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#2f5d8a" font-family="Menlo, monospace">accept()</text>
  <text x="683" y="340" text-anchor="middle" font-size="12" fill="#2f5d8a">꺼내서 conn 으로</text>
  <g font-size="13" fill="#2b3440">
    <text x="798" y="312">· accept 는 연결을</text>
    <text x="798" y="330">  <tspan font-weight="700">만들지 않고 꺼낸다</tspan></text>
    <text x="798" y="348">· 실측 대기열 <tspan font-family="Menlo, monospace">1/0/5</tspan></text>
  </g>
  <text x="20" y="390" font-size="13" fill="#2b3440">· 대기열 5칸이 꽉 차면 → 새 SYN 을 받아 주지 않아 클라이언트는 기다리다 시간 초과 <tspan fill="#857e72">(일반 원리 · 미실측)</tspan></text>
  <text x="20" y="410" font-size="13" fill="#2b3440">· listen 전·bind 전에 connect 하면? → <tspan font-weight="700">3장 그림</tspan>의 ❌ 두 줄</text>
</svg>
