<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker>
  </defs>
  <rect width="1000" height="590" fill="#fff"/>

  <!-- 네 기둥 -->
  <rect x="30" y="14" width="160" height="50" rx="10" fill="#e7eef6" stroke="#2f5d8a" stroke-width="2"/>
  <text x="110" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5d8a">서버 코드</text>
  <text x="110" y="55" text-anchor="middle" font-size="11" fill="#2f5d8a">내 Python 에코 서버</text>

  <rect x="300" y="14" width="180" height="50" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="390" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4a00">서버 OS (커널)</text>
  <text x="390" y="55" text-anchor="middle" font-size="11" fill="#7a4a00">TCP 상태 기계 · 대기열</text>

  <rect x="550" y="14" width="180" height="50" rx="10" fill="#fff4e5" stroke="#d98a1a" stroke-width="2"/>
  <text x="640" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#7a4a00">클라이언트 OS (커널)</text>
  <text x="640" y="55" text-anchor="middle" font-size="11" fill="#7a4a00">TCP 상태 기계</text>

  <rect x="810" y="14" width="160" height="50" rx="10" fill="#eef1f4" stroke="#5b6b7a" stroke-width="2"/>
  <text x="890" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">클라이언트 코드</text>
  <text x="890" y="55" text-anchor="middle" font-size="11" fill="#2b3440">nc</text>

  <line x1="110" y1="64" x2="110" y2="580" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="390" y1="64" x2="390" y2="580" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="640" y1="64" x2="640" y2="580" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="890" y1="64" x2="890" y2="580" stroke="#c5ccd3" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- 가게 열기: 서버 코드 → 서버 OS -->
  <g font-family="Menlo, monospace" font-size="13" fill="#2f5d8a">
    <text x="40" y="96">socket()</text>
    <text x="40" y="176">bind(9000)</text>
    <text x="40" y="256">listen()</text>
    <text x="40" y="296" font-weight="700">accept()</text>
  </g>
  <g stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="140" y1="91" x2="384" y2="91"/>
    <line x1="140" y1="171" x2="384" y2="171"/>
    <line x1="140" y1="251" x2="384" y2="251"/>
  </g>
  <g font-size="12" fill="#7a4a00">
    <text x="398" y="95">소켓 생김 (fd 5) · 주소 없음</text>
    <text x="398" y="175">9000번 등록 · <tspan font-family="Menlo, monospace">CLOSED</tspan></text>
    <text x="398" y="255"><tspan font-family="Menlo, monospace" font-weight="700">LISTEN</tspan> · 대기열 0/5</text>
  </g>

  <!-- 실패 ①: bind 전 -->
  <line x1="636" y1="116" x2="396" y2="116" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="560" y="111" font-size="11" fill="#2f6fd6" font-family="Menlo, monospace">SYN</text>
  <line x1="396" y1="134" x2="636" y2="134" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="404" y="148" font-size="11" fill="#c0392b" font-family="Menlo, monospace">RST "그 번호 없어요"</text>
  <rect x="656" y="110" width="330" height="30" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="668" y="130" font-size="12" fill="#c0392b"><tspan font-weight="700">❌ bind 전 connect</tspan> → <tspan font-family="Menlo, monospace">ConnectionRefused</tspan> 즉시</text>

  <!-- 실패 ②: bind 후 listen 전 -->
  <line x1="636" y1="208" x2="420" y2="208" stroke="#b26a00" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#o)"/>
  <text x="430" y="224" font-size="11" fill="#b26a00" font-family="Menlo, monospace">SYN … 아무도 대답 안 함</text>
  <rect x="656" y="194" width="330" height="30" rx="7" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
  <text x="668" y="214" font-size="12" fill="#b26a00"><tspan font-weight="700">❌ listen 전 connect</tspan> → <tspan font-family="Menlo, monospace">TimeoutError</tspan> (맥 · 2초)</text>

  <!-- accept 블로킹 막대 -->
  <rect x="100" y="306" width="20" height="215" rx="5" fill="#ffe7a0" stroke="#b26a00" stroke-width="1"/>
  <text x="128" y="326" font-size="12" fill="#7a4a00">⏸ accept() 에서</text>
  <text x="128" y="342" font-size="12" fill="#7a4a00">기다리는 중</text>
  <text x="128" y="358" font-size="11" fill="#857e72">(코드는 아무것도</text>
  <text x="128" y="372" font-size="11" fill="#857e72"> 하지 않는다)</text>

  <!-- 연결 = 3-way handshake 띠 -->
  <rect x="250" y="278" width="740" height="208" rx="12" fill="#eef7ec" stroke="#2f7d32" stroke-width="2"/>
  <text x="264" y="300" font-size="14" font-weight="700" fill="#2f7d32">⏱ 연결 발생 = 3-way handshake  —  listen() 뒤 · 클라이언트 connect() 안 · OS 끼리만</text>

  <!-- 클라이언트 connect -->
  <text x="820" y="328" font-size="13" fill="#2b3440" font-family="Menlo, monospace" font-weight="700">connect()</text>
  <line x1="815" y1="324" x2="646" y2="324" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="880" y="336" width="20" height="120" rx="5" fill="#e9edf2" stroke="#5b6b7a" stroke-width="1"/>
  <text x="906" y="356" font-size="11" fill="#5b6b7a">⏸ 기다림</text>

  <!-- SYN / SYN+ACK / ACK -->
  <line x1="636" y1="356" x2="396" y2="356" stroke="#2f6fd6" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="470" y="350" font-size="13" font-weight="700" fill="#2f6fd6">① SYN  "연결할래요?"</text>
  <line x1="396" y1="396" x2="636" y2="396" stroke="#2f6fd6" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="440" y="390" font-size="13" font-weight="700" fill="#2f6fd6">② SYN+ACK  "좋아요, 당신도?"</text>
  <line x1="636" y1="436" x2="396" y2="436" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="470" y="430" font-size="13" font-weight="700" fill="#555">③ ACK  "네!"</text>

  <!-- 상태 라벨 -->
  <g font-family="Menlo, monospace" font-size="11">
    <text x="652" y="360" fill="#2f6fd6">SYN_SENT</text>
    <text x="300" y="400" fill="#2f6fd6" text-anchor="start">SYN_RCVD</text>
    <text x="652" y="440" fill="#2f7d32" font-weight="700">ESTABLISHED</text>
    <text x="268" y="460" fill="#2f7d32" font-weight="700">ESTABLISHED</text>
  </g>
  <text x="398" y="476" font-size="12" fill="#7a4a00" font-weight="700">→ 대기열 1/5 에 세움</text>
  <text x="818" y="476" font-size="13" fill="#2f7d32" font-family="Menlo, monospace" font-weight="700">connect() ✅</text>

  <!-- accept 반환 -->
  <line x1="384" y1="526" x2="126" y2="526" stroke="#2f7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="160" y="518" font-size="13" fill="#2f7d32" font-weight="700">대기열에서 꺼냄</text>
  <text x="40" y="548" font-size="13" fill="#2f5d8a" font-family="Menlo, monospace" font-weight="700">accept() ✅</text>
  <text x="40" y="566" font-size="12" fill="#2f5d8a">→ conn (새 fd 6)</text>

</svg>
