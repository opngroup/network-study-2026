<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1160" height="430" fill="#fff"/>
<text x="20" y="32" font-size="20" fill="#44546a">모든 프레임은 9바이트 머리표로 시작한다 (RFC 7540 §4.1)</text>
<rect x="20" y="60" width="210" height="84" fill="#9aa7b8"/>
<text x="125.0" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">길이</text>
<text x="125.0" y="124" font-size="15" fill="#fff" text-anchor="middle">3바이트</text>
<text x="125.0" y="170" font-size="15" fill="#222" text-anchor="middle">이 조각이 몇 바이트인지</text>
<rect x="230" y="60" width="170" height="84" fill="#f5a623"/>
<text x="315.0" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">종류</text>
<text x="315.0" y="124" font-size="15" fill="#fff" text-anchor="middle">1바이트</text>
<text x="315.0" y="170" font-size="15" fill="#222" text-anchor="middle">HEADERS · DATA …</text>
<rect x="400" y="60" width="230" height="84" fill="#c2410c"/>
<text x="515.0" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">플래그</text>
<text x="515.0" y="124" font-size="15" fill="#fff" text-anchor="middle">1바이트</text>
<text x="515.0" y="170" font-size="15" fill="#222" text-anchor="middle">END_STREAM = 마지막 조각</text>
<rect x="630" y="60" width="250" height="84" fill="#e5484d"/>
<text x="755.0" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">스트림 번호</text>
<text x="755.0" y="124" font-size="15" fill="#fff" text-anchor="middle">4바이트 (31비트)</text>
<text x="755.0" y="170" font-size="15" fill="#222" text-anchor="middle">어느 요청의 조각인지</text>
<rect x="880" y="60" width="260" height="84" fill="#4c8bf5"/>
<text x="1010.0" y="96" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">내용</text>
<text x="1010.0" y="124" font-size="15" fill="#fff" text-anchor="middle">길이만큼</text>
<text x="1010.0" y="170" font-size="15" fill="#222" text-anchor="middle">헤더 또는 본문</text>
<line x1="20" y1="52" x2="880" y2="52" stroke="#222" stroke-width="2"/><text x="450" y="48" font-size="14" fill="#222" text-anchor="middle">머리표 9바이트</text>
<text x="20" y="226" font-size="20" font-weight="700" fill="#222">예: 로고 응답 하나가 프레임 2개가 된다</text>
<rect x="20" y="246" width="110" height="46" fill="#9aa7b8"/>
<text x="75.0" y="275" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">길이</text>
<rect x="130" y="246" width="150" height="46" fill="#f5a623"/>
<text x="205.0" y="275" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">HEADERS</text>
<rect x="280" y="246" width="200" height="46" fill="#c2410c"/>
<text x="380.0" y="275" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">—</text>
<rect x="480" y="246" width="90" height="46" fill="#30a46c"/>
<text x="525.0" y="275" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="570" y="246" width="330" height="46" fill="#4c8bf5"/>
<text x="735.0" y="275" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">:status 200, content-type …</text>
<rect x="20" y="304" width="110" height="46" fill="#9aa7b8"/>
<text x="75.0" y="333" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">길이</text>
<rect x="130" y="304" width="150" height="46" fill="#f5a623"/>
<text x="205.0" y="333" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">DATA</text>
<rect x="280" y="304" width="200" height="46" fill="#c2410c"/>
<text x="380.0" y="333" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">END_STREAM</text>
<rect x="480" y="304" width="90" height="46" fill="#30a46c"/>
<text x="525.0" y="333" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="570" y="304" width="330" height="46" fill="#4c8bf5"/>
<text x="735.0" y="333" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">로고 본문 5KB</text>
<text x="920" y="275" font-size="16" fill="#222">← 상태 코드와 헤더</text>
<text x="920" y="333" font-size="16" fill="#222">← 본문, "이게 마지막"</text>
<text x="20" y="392" font-size="18" font-weight="700" fill="#222">길이로 조각의 경계를, 스트림 번호로 주인을, 플래그로 끝을 안다</text>
<text x="20" y="418" font-size="15" fill="#6b7785">HTTP/1.1 은 글자를 읽어 가며 경계를 찾았다 (빈 줄, Content-Length) → HTTP/2 는 머리표만 보면 된다</text>
</svg>