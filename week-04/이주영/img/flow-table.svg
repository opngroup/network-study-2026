<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1160" height="470" fill="#fff"/>
<rect x="20" y="20" width="150" height="46" fill="#eef1f5" stroke="#c9d1dc"/>
<text x="95.0" y="50" font-size="20" font-weight="700" fill="#222" text-anchor="middle">버전</text>
<rect x="170" y="20" width="320" height="46" fill="#eef1f5" stroke="#c9d1dc"/>
<text x="330.0" y="50" font-size="20" font-weight="700" fill="#222" text-anchor="middle">풀려던 문제</text>
<rect x="490" y="20" width="270" height="46" fill="#eef1f5" stroke="#c9d1dc"/>
<text x="625.0" y="50" font-size="20" font-weight="700" fill="#222" text-anchor="middle">해결</text>
<rect x="760" y="20" width="380" height="46" fill="#eef1f5" stroke="#c9d1dc"/>
<text x="950.0" y="50" font-size="20" font-weight="700" fill="#222" text-anchor="middle">남은 문제</text>
<rect x="20" y="66" width="150" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="36" y="111" font-size="20" fill="#222" font-weight="700">HTTP/1.1</text>
<rect x="170" y="66" width="320" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="186" y="111" font-size="20" fill="#222" font-weight="400">요청마다 새 커넥션</text>
<rect x="490" y="66" width="270" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="506" y="111" font-size="20" fill="#222" font-weight="400">keep-alive 로 재사용</text>
<rect x="760" y="66" width="380" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="776" y="96" font-size="15" font-weight="700" fill="#e5484d">HTTP 병목</text>
<text x="776" y="122" font-size="20" fill="#222">응답이 차례로만 온다</text>
<rect x="20" y="140" width="150" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="36" y="185" font-size="17" fill="#222" font-weight="700">(브라우저의 대응)</text>
<rect x="170" y="140" width="320" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="186" y="170" font-size="15" font-weight="700" fill="#e5484d">HTTP 병목</text>
<text x="186" y="196" font-size="20" fill="#222">병렬로 못 받는다</text>
<rect x="490" y="140" width="270" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="506" y="185" font-size="20" fill="#222" font-weight="400">커넥션 6개</text>
<rect x="760" y="140" width="380" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="776" y="185" font-size="20" fill="#222" font-weight="400">커넥션 비용, 대역폭 경쟁</text>
<rect x="20" y="214" width="150" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="36" y="259" font-size="20" fill="#222" font-weight="700">HTTP/2</text>
<rect x="170" y="214" width="320" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="186" y="244" font-size="15" font-weight="700" fill="#e5484d">HTTP 병목</text>
<text x="186" y="270" font-size="20" fill="#222">한 번에 요청 하나씩만</text>
<rect x="490" y="214" width="270" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="506" y="259" font-size="20" fill="#222" font-weight="400">스트림 멀티플렉싱</text>
<rect x="760" y="214" width="380" height="74" fill="#fff" stroke="#c9d1dc"/>
<text x="776" y="244" font-size="15" font-weight="700" fill="#2f7fe0">TCP 병목</text>
<text x="776" y="270" font-size="20" fill="#222">패킷 하나 잃으면 다 멈춘다</text>
<rect x="20" y="288" width="150" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="36" y="333" font-size="20" fill="#222" font-weight="700">HTTP/3</text>
<rect x="170" y="288" width="320" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="186" y="318" font-size="15" font-weight="700" fill="#2f7fe0">TCP 병목</text>
<text x="186" y="344" font-size="20" fill="#222">TCP 가 순서를 강제</text>
<rect x="490" y="288" width="270" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="506" y="333" font-size="20" fill="#222" font-weight="400">UDP 위의 QUIC</text>
<rect x="760" y="288" width="380" height="74" fill="#f8f9fb" stroke="#c9d1dc"/>
<text x="776" y="333" font-size="20" fill="#222" font-weight="400">—</text>
<rect x="764" y="70" width="372" height="66" rx="8" fill="none" stroke="#e5484d" stroke-width="4"/>
<rect x="174" y="144" width="312" height="66" rx="8" fill="none" stroke="#e5484d" stroke-width="4"/>
<rect x="174" y="218" width="312" height="66" rx="8" fill="none" stroke="#e5484d" stroke-width="4"/>
<rect x="764" y="218" width="372" height="66" rx="8" fill="none" stroke="#2f7fe0" stroke-width="4"/>
<rect x="174" y="292" width="312" height="66" rx="8" fill="none" stroke="#2f7fe0" stroke-width="4"/>
<rect x="20" y="374" width="28" height="28" rx="6" fill="none" stroke="#e5484d" stroke-width="4"/>
<text x="60" y="396" font-size="19" fill="#222"><tspan font-weight="700" fill="#e5484d">HTTP 병목</tspan> = HTTP 계층의 HOL 블로킹 → HTTP/2 가 해결</text>
<rect x="600" y="374" width="28" height="28" rx="6" fill="none" stroke="#2f7fe0" stroke-width="4"/>
<text x="640" y="396" font-size="19" fill="#222"><tspan font-weight="700" fill="#2f7fe0">TCP 병목</tspan> = TCP 계층의 HOL 블로킹 → HTTP/3 가 해결</text>
<text x="20" y="436" font-size="17" fill="#6b7785">HOL(Head-of-Line) 블로킹 = 맨 앞이 막히면 뒤가 전부 기다리는 현상 · 앞 버전의 "남은 문제"가 다음 버전의 "풀려던 문제"가 된다</text>
</svg>