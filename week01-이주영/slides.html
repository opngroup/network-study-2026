</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-paginate="true" lang="en-US" data-marpit-pagination="1" style="--paginate:true;" data-marpit-pagination-total="24">
<h1 id="%ED%8F%AC%ED%8A%B8%EC%99%80-nat">포트와 NAT</h1>
<p>1주차 · 2026-10-19 · 이주영</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" lang="en-US" data-marpit-pagination="2" style="--paginate:true;" data-marpit-pagination-total="24"></section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" lang="en-US" data-marpit-pagination="3" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%ED%98%B8%EA%B8%B0%EC%8B%AC1-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EC%97%90%EC%84%9C-%ED%8A%B9%EC%A0%95-%EC%82%AC%EC%9D%B4%ED%8A%B8%EB%A5%BC-%EC%97%B4%EB%A9%B4-%EB%82%B4-%ED%8F%AC%ED%8A%B8%EB%8A%94-%EB%AA%87-%EB%B2%88%EC%9D%BC%EA%B9%8C">호기심1. 브라우저에서 특정 사이트를 열면, 내 포트는 몇 번일까?</h2>
<ul>
<li>주소창에 <code>https://naver.com</code>을 쳤을 때 무사히 해당 서버로 접근하게 되고 정상적인 리소스도 받아오게 된다. 그런데 나는 내 컴퓨터의 포트를 지정한 적은 없다.</li>
<li>그런데 TCP 연결에는 <strong>클라이언트/서버 모두</strong> 포트가 있어야 한다</li>
</ul>
<blockquote>
<p>요청하는 쪽 포트는 <strong>누가</strong>, <strong>어떤 범위에서</strong>, <strong>어떻게</strong> 정했을까?</p>
</blockquote>
<p>포트 정의 : 같이 이야기해보시죠~ (다음 장 정의 있음)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" lang="en-US" data-marpit-pagination="4" style="--paginate:true;" data-marpit-pagination-total="24">
<p><strong>포트 정의</strong> : A software-based communication endpoint that <strong>directs network data</strong> to the <strong>correct application</strong> or <strong>service</strong> on a computer. (컴퓨터 네트워크와 운영 체제에서 데이터가 전송되는 논리적인 통로(종단점))</p>
<h2 id="%EA%B0%99%EC%9D%B4-%EA%B3%A0%EB%AF%BC%ED%95%B4-%EB%B3%B4%EA%B8%B0">같이 고민해 보기</h2>
<ol>
<li>난 포트를 고른 적이 없는데 그럼 누가 골랐을까?</li>
<li>서버 포트는 왜 늘 <code>443</code> 으로 <strong>고정</strong>일까? 서버도 아무 번호나 쓰면?</li>
<li>같은 서버에 연결이 여러 개 붙어 있는데, 서버는 클라이언트를 각각 어떻게 식별할까?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" lang="en-US" data-marpit-pagination="5" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%ED%99%95%EC%9D%B8%ED%95%B4%EB%B3%B4%EC%8B%9C%EC%A3%A0-%ED%84%B0%EB%AF%B8%EB%84%90%EC%9D%84-%ED%86%B5%ED%95%B4-%ED%99%95%EC%9D%B8%ED%95%B4%EB%B3%B4%EC%8B%9C%EC%A3%A0">확인해보시죠: 터미널을 통해 확인해보시죠</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ lsof -iTCP -sTCP:ESTABLISHED -n -P | grep :443
192.168.219.41:5xxxx -&gt; 160.79.104.10:443
192.168.219.41:5xxxx -&gt; 160.79.104.10:443
192.168.219.41:5xxxx -&gt; 160.79.104.10:443
</code></pre>
<ul>
<li>오른쪽(서버) 포트는 전부 <code>443</code> — HTTPS 의 <strong>잘 알려진 포트</strong></li>
<li>왼쪽(내 쪽) 포트는 줄마다 다르고, 전부 <strong>5만번대</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ sysctl net.inet.ip.portrange.first net.inet.ip.portrange.last
net.inet.ip.portrange.first: 49152
net.inet.ip.portrange.last: 65535
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" lang="en-US" data-marpit-pagination="6" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EC%95%8C%EA%B3%A0-%EC%9E%88%EC%A7%80%EB%A7%8C-%EB%8B%A4%EC%8B%9C-%EC%A0%95%EB%A6%AC%ED%95%B4%EB%B3%B4%EB%A9%B4-%ED%8F%AC%ED%8A%B8-%EB%B2%88%ED%98%B8%EB%8A%94-%EC%84%B8-%EA%B5%AC%EC%97%AD%EC%9C%BC%EB%A1%9C-%EB%82%98%EB%89%A9%EB%8B%88%EB%8B%A4">알고 있지만 다시 정리해보면 포트 번호는 세 구역으로 나뉩니다.</h2>
<table>
<thead>
<tr>
<th>구역</th>
<th>범위</th>
<th>누가 쓰나</th>
</tr>
</thead>
<tbody>
<tr>
<td>잘 알려진 포트</td>
<td>0 ~ 1023</td>
<td>표준 서비스 (80 HTTP · 443 HTTPS · 22 SSH)</td>
</tr>
<tr>
<td>등록된 포트</td>
<td>1024 ~ 49151</td>
<td>특정 애플리케이션 (5432 Postgres 등)</td>
</tr>
<tr>
<td><strong>동적 포트</strong></td>
<td><strong>49152 ~ 65535</strong></td>
<td><strong>OS 가 클라이언트에게 잠깐 빌려주는 번호</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>범위는 OS 마다 다르다 (리눅스 기본 32768 ~ 60999)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" lang="en-US" data-marpit-pagination="7" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EC%84%9C%EB%B2%84%EB%A1%9C-%EC%9A%94%EC%B2%AD%EC%9D%84-%EB%B3%B4%EB%82%B4%EA%B3%A0-%ED%81%B4%EB%9D%BC%EC%9D%B4%EC%96%B8%ED%8A%B8%EB%A1%9C-%EC%9D%91%EB%8B%B5%EC%9D%B4-%EC%98%A4%EB%8A%94-%EB%8B%A8%EA%B3%84%EB%A5%BC-%EC%82%B4%ED%8E%B4%EB%B3%B4%EC%8B%9C%EC%A3%A0">서버로 요청을 보내고 클라이언트로 응답이 오는 단계를 살펴보시죠</h2>
<table>
<thead>
<tr>
<th style="text-align:center">① 포트 설정</th>
<th style="text-align:center">→</th>
<th style="text-align:center">② 담기</th>
<th style="text-align:center">→</th>
<th style="text-align:center">③ 구분한다</th>
<th style="text-align:center">→</th>
<th style="text-align:center">④ 응답</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>내 맥 OS</strong></td>
<td style="text-align:center"></td>
<td style="text-align:center"><strong>패킷 헤더</strong></td>
<td style="text-align:center"></td>
<td style="text-align:center"><strong>서버</strong></td>
<td style="text-align:center"></td>
<td style="text-align:center"><strong>서버 → 내 맥</strong></td>
</tr>
<tr>
<td style="text-align:center">빈 번호 <code>52101</code> 배정</td>
<td style="text-align:center"></td>
<td style="text-align:center">IP 헤더에 IP<br />TCP 헤더에 포트</td>
<td style="text-align:center"></td>
<td style="text-align:center">4-튜플로<br />어느 연결인지 찾음</td>
<td style="text-align:center"></td>
<td style="text-align:center">출발지·목적지를<br />뒤집어 보냄</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>요청   192.168.219.41:52101  ──────▶  160.79.104.10:443
응답   192.168.219.41:52101  ◀──────  160.79.104.10:443
</code></pre>
<ul>
<li>클라이언트 포트는 <strong>①에서 한 번</strong> 정해지고, ②~④ 내내 해당 포트로 통신이 이루어진다.</li>
</ul>
<p>Q. 혹시 4-tuple에 대해서 아시나요?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" lang="en-US" data-marpit-pagination="8" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="4-%ED%8A%9C%ED%94%8C-%EC%84%9C%EB%B2%84-os%EA%B0%80-%EC%97%B0%EA%B2%B0%EC%9D%84-%EA%B4%80%EB%A6%AC%ED%95%98%EB%8A%94-%EB%B0%A9%EC%8B%9D">4-튜플? 서버 OS가 연결을 관리하는 방식</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ts"><span class="hljs-keyword">type</span> <span class="hljs-title class_">Connection</span> = [srcIp, srcPort, dstIp, dstPort]; <span class="hljs-comment">// 튜플 = 값을 순서대로 묶은 것</span>
</code></pre>
<p>서버 OS 는 열린 연결을 <strong>표</strong>로 들고 있고, 4-튜플이 그 표의 <strong>기본 키</strong>다</p>
<table>
<thead>
<tr>
<th>출발지 IP</th>
<th style="text-align:center">출발지 포트</th>
<th>목적지 IP</th>
<th style="text-align:center">목적지 포트</th>
<th>→ 연결</th>
</tr>
</thead>
<tbody>
<tr>
<td>192.168.219.41</td>
<td style="text-align:center"><strong>52101</strong></td>
<td>160.79.104.10</td>
<td style="text-align:center">443</td>
<td>A · 메인 페이지</td>
</tr>
<tr>
<td>192.168.219.41</td>
<td style="text-align:center"><strong>52188</strong></td>
<td>160.79.104.10</td>
<td style="text-align:center">443</td>
<td>B · 이미지</td>
</tr>
<tr>
<td>192.168.219.41</td>
<td style="text-align:center"><strong>52230</strong></td>
<td>160.79.104.10</td>
<td style="text-align:center">443</td>
<td>C · 스크립트</td>
</tr>
</tbody>
</table>
<ul>
<li>패킷이 오면 헤더의 네 값으로 이 표를 <strong>조회</strong> → 어느 연결인지 찾는다</li>
<li>기본 키라서 <strong>겹치면 안 된다</strong> → 하나만 달라도 다른 연결</li>
</ul>
<p>다시 서버로 요청을 보내고 클라이언트로 응답이 오는 단계를 살펴보시죠.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" lang="en-US" data-marpit-pagination="9" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%E2%91%A0-%ED%8F%AC%ED%8A%B8-%EC%84%A4%EC%A0%95-%EC%97%B0%EA%B2%B0%EC%9D%84-%EB%A7%BA%EC%9D%84-%EB%95%8C-os-%EA%B0%80-%EB%B9%88-%ED%8F%AC%ED%8A%B8%EB%A5%BC-%EB%B6%99%EC%9D%B8%EB%8B%A4">① 포트 설정: 연결을 맺을 때 OS 가 빈 포트를 붙인다</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>브라우저: &quot;160.79.104.10:443 에 연결해 줘&quot;   ← 포트는 말하지 않음
   │
   ▼
OS: 동적 포트 범위에서 지금 안 쓰는 번호 → 52101 배정
</code></pre>
<ul>
<li><strong>누가</strong>: 브라우저가 아니라 OS</li>
<li><strong>언제</strong>: 요청마다가 아니라 <strong>연결을 맺을 때 한 번</strong>. keep-alive 로 요청이 여러 번 오가도 번호는 그대로</li>
<li>이 번호를 <strong>임시 포트(ephemeral port)</strong> 라고 부른다. 연결이 끝나면 반납</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" lang="en-US" data-marpit-pagination="10" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%E2%91%A1-%EB%8B%B4%EA%B8%B0-%ED%8F%AC%ED%8A%B8%EB%8A%94-tcp-%ED%97%A4%EB%8D%94%EC%97%90-ip-%EB%8A%94-ip-%ED%97%A4%EB%8D%94%EC%97%90">② 담기: 포트는 TCP 헤더에, IP 는 IP 헤더에</h2>
<table>
<thead>
<tr>
<th>IP 헤더</th>
<th>TCP 헤더</th>
<th>데이터</th>
</tr>
</thead>
<tbody>
<tr>
<td>출발지 IP <code>192.168.219.41</code></td>
<td>출발지 포트 <code>52101</code></td>
<td>HTTP 요청</td>
</tr>
<tr>
<td>목적지 IP <code>160.79.104.10</code></td>
<td>목적지 포트 <code>443</code></td>
<td></td>
</tr>
</tbody>
</table>
<ul>
<li>이 연결의 <strong>모든 패킷</strong>에 같은 번호가 실린다</li>
<li>네 값은 두 헤더에 나뉘어 실린다 → 합친 것이 <strong>4-튜플</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" lang="en-US" data-marpit-pagination="11" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%E2%91%A2-%EA%B5%AC%EB%B6%84%ED%95%9C%EB%8B%A4-%EC%84%9C%EB%B2%84%EB%8A%94-4-%ED%8A%9C%ED%94%8C%EB%A1%9C-%EC%97%B0%EA%B2%B0%EC%9D%84-%EA%B0%80%EB%A6%B0%EB%8B%A4">③ 구분한다: 서버는 4-튜플로 연결을 가린다</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>           출발지 IP        출발지 포트   목적지 IP        목적지 포트
연결 A   192.168.219.41      52101      160.79.104.10      443
연결 B   192.168.219.41      52188      160.79.104.10      443
연결 C   192.168.219.41      52230      160.79.104.10      443
                            └ 여기만 다름 ┘
</code></pre>
<ul>
<li>네 값 중 <strong>하나만 달라도 다른 연결</strong></li>
<li>그래서 OS 는 <strong>안 쓰는</strong> 번호를 골라야 한다 — 겹치면 두 연결을 구분할 수 없다</li>
<li>서버는 <code>443</code> 하나로 수많은 클라이언트를 받는다. 구분은 클라이언트 쪽 칸이 맡는다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" lang="en-US" data-marpit-pagination="12" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%E2%91%A3-%EC%9D%91%EB%8B%B5-%EC%B6%9C%EB%B0%9C%EC%A7%80%EC%99%80-%EB%AA%A9%EC%A0%81%EC%A7%80%EB%A5%BC-%EB%92%A4%EC%A7%91%EC%96%B4-%EB%8F%8C%EB%A0%A4%EB%B3%B4%EB%82%B8%EB%8B%A4">④ 응답: 출발지와 목적지를 뒤집어 돌려보낸다</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>요청   192.168.219.41:52101  ──────▶  160.79.104.10:443
응답   192.168.219.41:52101  ◀──────  160.79.104.10:443
       (응답 패킷에서는 이쪽이 목적지)
</code></pre>
<ul>
<li>서버는 클라이언트 주소를 <strong>미리 알 필요가 없다</strong> — 들어온 패킷의 출발지 칸에 적혀 있다</li>
<li>서버가 하는 일 두 가지
<ol>
<li>이 패킷이 <strong>어느 연결</strong> 것인지 찾는다 (4-튜플)</li>
<li>답장을 <strong>어디로</strong> 보낼지 정한다 (출발지 IP·포트를 목적지로)</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" lang="en-US" data-marpit-pagination="13" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EC%A0%95%EB%A6%AC">정리</h2>
<blockquote>
<p>서버는 <strong>먼저 찾아와야 하는 쪽</strong>을 위해 번호를 고정하고,<br />
클라이언트는 <strong>답장 주소를 패킷에 실어 보내니까</strong> OS 가 고른 빈 번호를 써도 된다.</p>
</blockquote>
<ul>
<li>그런데 공유기 뒤에 노트북이 여러 대면? 출발지 IP 가 모두 공인 IP 하나로 바뀐다</li>
<li>→ 우연히 포트까지 같으면 4-튜플이 겹친다. 여기서 <strong>NAPT</strong> 가 시작된다 (질문 2)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" lang="en-US" data-marpit-pagination="14" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EA%B3%B5%EC%9C%A0%EA%B8%B0%EC%9D%98-%EC%97%AD%ED%95%A0%EC%9D%B4-%EB%AC%B4%EC%97%87%EC%9D%B8%EA%B0%80%EC%9A%94">공유기의 역할이 무엇인가요?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" lang="en-US" data-marpit-pagination="15" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EA%B3%B5%EC%9C%A0%EA%B8%B0%EA%B0%80-%ED%95%98%EB%8A%94-%EC%9D%BC-%EB%84%A4-%EA%B0%80%EC%A7%80">공유기가 하는 일 네 가지</h2>
<table>
<thead>
<tr>
<th>역할</th>
<th>한 줄로</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. 주소 나눠 주기</strong> (DHCP)</td>
<td>집 안 기기에 사설 IP 배정 — 내 맥 <code>192.168.219.41</code></td>
</tr>
<tr>
<td><strong>2. 길 안내</strong> (게이트웨이)</td>
<td>밖으로 가는 패킷은 전부 공유기 <code>192.168.219.1</code> 로</td>
</tr>
<tr>
<td><strong>3. 주소 바꾸기</strong> (NAT · NAPT)</td>
<td>나갈 때 사설 IP → 공인 IP <code>124.52.x.x</code></td>
</tr>
<tr>
<td><strong>4. 무선 연결</strong> (Wi-Fi)</td>
<td>기기를 전파로 집 안 네트워크에 붙인다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-c1Y1bbnC="" data-paginate="true" lang="en-US" data-marpit-pagination="16" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EC%98%A4%EB%8A%98-%EC%82%B4%ED%8E%B4%EB%B3%BC-%EA%B2%83%EC%9D%80-3-%EC%A3%BC%EC%86%8C-%EB%B0%94%EA%BE%B8%EA%B8%B0">오늘 살펴볼 것은 3. 주소 바꾸기</h2>
<table>
<thead>
<tr>
<th>역할</th>
<th>한 줄로</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. 주소 나눠 주기</strong> (DHCP)</td>
<td>집 안 기기에 사설 IP 배정 — 내 맥 <code>192.168.219.41</code></td>
</tr>
<tr>
<td><strong>2. 길 안내</strong> (게이트웨이)</td>
<td>밖으로 가는 패킷은 전부 공유기 <code>192.168.219.1</code> 로</td>
</tr>
<tr>
<td><strong>3. 주소 바꾸기</strong> (NAT · NAPT)</td>
<td>나갈 때 사설 IP → 공인 IP <code>124.52.x.x</code></td>
</tr>
<tr>
<td><strong>4. 무선 연결</strong> (Wi-Fi)</td>
<td>기기를 전파로 집 안 네트워크에 붙인다</td>
</tr>
</tbody>
</table>
<ul>
<li>주소를 바꿔줘야하는 이유는 사설 IP는 인터넷망을 사용하지 못하기 때문에 공인 IP로 포워딩해줘야한다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" lang="en-US" data-marpit-pagination="17" style="--paginate:true;" data-marpit-pagination-total="24">

<ul>
<li>집 안은 <strong>사설 IP</strong>(10.x · 172.16~31.x · 192.168.x), 인터넷에서는 <strong>공인 IP</strong> 하나</li>
<li>공유기가 <strong>출발지를 공인 IP 로 바꿔</strong> 내보내는데 서버 입장에선 세 기기가 모두 <code>124.52.x.x</code>이다.</li>
<li>그럼 서버로 부터 받은 응답은 어떻게 클라이언트를 식별해서 전달해줄 수 있는거지?</li>
</ul>
</section>

<h2 id="nat-%EC%99%80-napt-%EB%8A%94-%EB%AC%B4%EC%97%87%EC%9D%B4%EA%B3%A0-%EC%99%9C-%EC%9E%88%EB%82%98">NAT 와 NAPT 는 무엇이고, 왜 있나?</h2>
<p><strong>NAT</strong> (Network Address Translation, 네트워크 주소 변환)</p>
<ul>
<li>패킷이 공유기를 지날 때 <strong>IP 주소를 다른 IP 로 바꿔 쓰는 것</strong></li>
<li>나갈 때: 출발지 사설 IP → 공인 IP · 돌아올 때: 목적지 공인 IP → <strong>원래 사설 IP</strong></li>
</ul>
<p><strong>NAPT</strong> (Network Address <strong>Port</strong> Translation)</p>
<ul>
<li>NAT 에 더해 <strong>포트 번호까지</strong> 바꿔 쓰는 것 → 공인 IP <strong>하나</strong>를 여러 기기가 나눠 쓴다</li>
<li>우리가 집·회사에서 &quot;NAT&quot; 라고 부르는 건 대부분 이것이다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" lang="en-US" data-marpit-pagination="19" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="nat-%EC%99%80-napt-%EB%8A%94-%EB%AC%B4%EC%97%87%EC%9D%B4%EA%B3%A0-%EC%99%9C-%EC%9E%88%EB%82%98-1">NAT 와 NAPT 는 무엇이고, 왜 있나?</h2>
<h3 id="%EC%99%9C-%EC%9E%88%EB%82%98">왜 있나?</h3>
<ul>
<li>IPv4 주소는 2³² ≈ <strong>43억 개</strong>뿐 — 기기 수보다 적다.</li>
<li>그래서 안에서는 사설 IP(<a href="https://www.rfc-editor.org/rfc/rfc1918">RFC 1918</a>)를 쓰고, 밖에 나갈 때만 공인 IP 를 빌려 쓴다</li>
<li>추가적으로 NAT 표에 없는 패킷은 버리니 밖에서 함부로 못 들어온다 (단, 원래 보안을 목적으로한 기능은 아니다.)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" lang="en-US" data-marpit-pagination="20" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="nat-vs-napt-%ED%8F%AC%ED%8A%B8%EA%B9%8C%EC%A7%80-%EB%B0%94%EA%BE%B8%EB%8A%90%EB%83%90">NAT vs NAPT: 포트까지 바꾸느냐</h2>
<table>
<thead>
<tr>
<th></th>
<th>NAT (1:1)</th>
<th>NAPT</th>
</tr>
</thead>
<tbody>
<tr>
<td>바꾸는 칸</td>
<td><strong>IP 만</strong></td>
<td>IP + <strong>포트</strong></td>
</tr>
<tr>
<td>변환 테이블</td>
<td><code>사설 IP ↔ 공인 IP</code></td>
<td><code>사설 IP:포트 ↔ 공인 IP:포트</code></td>
</tr>
<tr>
<td>공인 IP</td>
<td>기기 수만큼</td>
<td><strong>하나</strong>로 여러 기기</td>
</tr>
<tr>
<td>다른 이름 · 예</td>
<td>AWS EC2 + 탄력적 IP</td>
<td>PAT · IP 마스커레이드 · 집 공유기</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>NAPT 변환 테이블
192.168.219.41:52101  ↔  124.52.x.x:40001
192.168.219.42:52101  ↔  124.52.x.x:40002   ← 원래 포트가 같아도 바깥 포트는 다르게
</code></pre>
<ul>
<li>응답이 <code>124.52.x.x:40002</code> 로 오면 → 표에서 찾아 <strong>노트북 B</strong> 에게</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-FL6r0xTr="" data-paginate="true" lang="en-US" data-marpit-pagination="21" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EC%8B%A4%ED%97%98-%EA%B3%B5%EC%9C%A0%EA%B8%B0%EA%B0%80-%EB%B0%94%EA%BE%BC-%EA%B2%83%EC%9D%84-%EB%88%88%EC%9C%BC%EB%A1%9C-%EB%B3%B4%EA%B8%B0">실험: 공유기가 바꾼 것을 눈으로 보기</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>내 맥이 쓴 출발지 (사설)</th>
<th>서버가 본 출발지 (공인)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>192.168.219.41:<strong>53483</strong></td>
<td>124.52.x.x:<strong>58332</strong></td>
</tr>
<tr>
<td>2</td>
<td>192.168.219.41:<strong>53485</strong></td>
<td>124.52.x.x:<strong>47184</strong></td>
</tr>
<tr>
<td>3</td>
<td>192.168.219.41:<strong>53486</strong></td>
<td>124.52.x.x:<strong>41090</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><strong>IP 가 바뀌었다</strong> → NAT · <strong>포트도 바뀌었다</strong> → NAPT</li>
<li>OS 는 거의 차례대로, 공유기는 뒤죽박죽 — <strong>서로 다른 번호표 기계</strong></li>
<li>응답이 <code>:41090</code> 으로 오면 → 공유기가 <code>192.168.219.41:53486</code> 으로 되돌려 준다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" lang="en-US" data-marpit-pagination="22" style="--paginate:true;" data-marpit-pagination-total="24">

<h2 id="napt-%EB%8A%94-%EC%96%B4%EB%96%BB%EA%B2%8C-%EA%B5%AC%ED%98%84%EB%8F%BC-%EC%9E%88%EB%82%98-%EB%A6%AC%EB%88%85%EC%8A%A4-%EA%B3%B5%EC%9C%A0%EA%B8%B0-%EA%B8%B0%EC%A4%80">NAPT 는 어떻게 구현돼 있나 (리눅스 공유기 기준)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>나갈 때  ① 연결 추적 표 조회 → 없음 → ② NAT 규칙 적용 → ③ 표에 행 추가 → 헤더 고쳐 쓰기 + 체크섬 재계산
돌아올 때 ④ 연결 추적 표 조회 → 있음 → 목적지를 원래대로 되돌려 쓰기
</code></pre>
<table>
<thead>
<tr>
<th>부품</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>conntrack</strong> (연결 추적 표)</td>
<td>변환 테이블의 실체. 커널 해시 테이블, 행마다 원래 방향·응답 방향 튜플 + 상태 + 만료 시간</td>
</tr>
<tr>
<td><strong>NAT 규칙</strong> <code>MASQUERADE</code></td>
<td>&quot;바깥으로 나가는 패킷은 출발지를 내 공인 IP 로&quot; — <strong>첫 패킷에만</strong> 적용, 이후는 표만 본다</td>
</tr>
<tr>
<td><strong>헤더 고쳐 쓰기</strong></td>
<td>IP·포트가 체크섬에 들어가므로 바꾸면 다시 계산</td>
</tr>
</tbody>
</table>
<ul>
<li>웹 개발자식으로 보면 <code>Map&lt;응답 튜플, 원래 주소&gt;</code> — 질문 1 의 &quot;기본 키&quot; 표와 같은 생각</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-6NBdvsbC="" data-paginate="true" lang="en-US" data-marpit-pagination="24" style="--paginate:true;" data-marpit-pagination-total="24">
<h2 id="%EB%A7%88%EB%AC%B4%EB%A6%AC-%EB%82%B4-%EC%9A%94%EC%B2%AD%EC%9D%B4-%EC%84%9C%EB%B2%84%EA%B9%8C%EC%A7%80-%EA%B0%94%EB%8B%A4%EA%B0%80-%EB%8F%8C%EC%95%84%EC%98%A4%EB%8A%94-%EB%B0%A9%EC%8B%9D">마무리: 내 요청이 서버까지 갔다가 돌아오는 방식</h2>
<table>
<thead>
<tr>
<th style="text-align:center">#</th>
<th>누가</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">1</td>
<td><strong>내 맥 OS</strong></td>
<td>빈 포트를 붙여 보낸다 → <code>192.168.219.41:53486</code></td>
</tr>
<tr>
<td style="text-align:center">2</td>
<td><strong>공유기</strong> (NAPT)</td>
<td>공인 IP·새 포트로 바꾸고 표에 적는다 → <code>124.52.x.x:41090</code></td>
</tr>
<tr>
<td style="text-align:center">3</td>
<td><strong>서버</strong></td>
<td>4-튜플로 연결을 가리고, 출발지로 답장한다</td>
</tr>
<tr>
<td style="text-align:center">4</td>
<td><strong>공유기</strong></td>
<td>표에서 찾아 원래 주소로 되돌린다 → <code>192.168.219.41:53486</code></td>
</tr>
<tr>
<td style="text-align:center">5</td>
<td><strong>내 맥 OS</strong></td>
<td>4-튜플로 어느 프로그램의 연결인지 찾아 넘긴다</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>포트</strong>: 서버는 찾아와야 하니 고정(443), 클라이언트는 OS 가 빈 번호를 빌려준다</li>
<li><strong>NAT / NAPT</strong>: 사설 IP 는 인터넷에서 못 쓴다 → 공유기가 공인 IP 로, 포트까지 바꿔 한 IP 를 여럿이 나눠 쓴다</li>
<li><strong>같은 생각 두 번</strong>: 서버는 연결 표로, 공유기는 변환 표로 — 둘 다 &quot;튜플로 찾는 표&quot;</li>
